name: npm Release

# npm publish path for the @guuey/* cohort, via npm Trusted Publishing
# (GitHub OIDC — no NPM_TOKEN secret anywhere). This file lives at the
# guuey-sdks mirror (withguuey/guuey-sdks) — the repo the npmjs
# trusted-publisher config points at.
#
# Cohort (leaf-first, mirrors the ORDER array below): @guuey/hooks (the
# hook spec — types + zod schemas + the per-event table, guuey#1528; a leaf
# @guuey/config composes), @guuey/config,
# @guuey/state (KV developer preview — in-memory binding, contract locked),
# @guuey/fs (GuueyFS dev-guidance helper — homeDir/appDir/sessionDir, zero
# deps, a leaf), @guuey/mcp-apps-host (the MCP Apps SEP-1865 Host role —
# view-mount narrowing + locator rehydration; deps @silverprotocol/core +
# @ggui-ai/protocol, a leaf), @guuey/threads (universal session/thread
# persistence — ThreadStore + fold↔row mapping + in-memory binding; npm
# deps are @silverprotocol/core and @guuey/mcp-apps-host/narrowing),
# @guuey/widget-auth (embeddable-widget
# token minting for a customer's backend — zero deps, a leaf), @guuey/worker,
# @guuey/agent-client (the embed chat SDK), @guuey/chat (the default
# transcript UI — wave 3a headless view-model + calm/debug presets + the
# GuueyChatTheme platform-data schema; deps agent-client + mcp-apps-host +
# @silverprotocol/core), @guuey/host,
# @guuey/create-agentic-app, @guuey/cli.
# First-ever publishes are MANUAL: a trusted publisher can only be attached
# to a package that already exists on npm (the org owner's live read on
# npmjs, 2026-09-19, and the registry agrees — @guuey/chat@0.4.0, the
# package's first version, was published by hand on 2026-08-15 with no
# attestation; OIDC provenance starts at 0.5.0. This header once claimed the
# opposite, and the claim sent the next new package the wrong way, guuey#1528).
#
# COUPLED SET-MOVE — config + cli + create-agentic-app publish TOGETHER.
# The colocated-MCP flip (slice B, 2026-07-21) made these three a single
# unit: @guuey/config >=0.1.2 carries the `kind:'colocated'` zod arm,
# @guuey/cli >=0.1.4 carries colocated auto-spawn, and
# @guuey/create-agentic-app >=0.1.4 scaffolds a guuey.json whose todo MCP
# is `kind:'colocated'` and pins config/cli via templates-src/versions.json.
# Publishing create-agentic-app WITHOUT the matching config/cli versions
# ships a scaffold whose pinned config rejects its own guuey.json
# (`Invalid discriminator value`) — golden path broken out of the box.
# Bump + publish all three as a set; `check-templates.mjs` enforces
# versions.json == workspace versions at build time.
#
# Release model: "publish what's in git."
#   - Versions come from each packages/<pkg>/package.json as committed.
#     This workflow never mutates package.json or git state.
#   - Already-published `name@version` targets are skipped (idempotent
#     re-runs after a partial publish), never overwritten.
#   - `workspace:*` deps are rewritten to real versions by `pnpm publish`.
#
# Triggers:
#   1. `workflow_dispatch` — dry-run by default; a live publish requires
#      `dry-run: false` AND `confirm: yes` (a misclick cannot ship).
#   2. `release: [published]` — cutting a GitHub Release IS the human
#      acknowledgement; always live.
#
# npmjs.com one-time setup (org owner): for each package in the publish ORDER,
# configure a Trusted Publisher — owner `withguuey`, repo `guuey-sdks`, workflow
# `release.yml`, environment `npm-publish`. A NEW package is bootstrapped by
# hand: from a clean checkout of the mirror at the synced commit, install
# frozen, build, test, then `pnpm publish --no-git-checks` with 2FA from the
# package dir (`pnpm publish`, never `npm publish`: only pnpm rewrites a
# `workspace:` specifier, guuey#449), THEN attach the four values above. Both
# are the org owner's steps. The next cut publishes that package via OIDC like
# the rest; until both have happened the cut's fire gate refuses on that
# member (leg 5) — a publish the workflow cannot perform leaves the cohort
# partial.

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "If true (default), pnpm publish --dry-run only — nothing lands on npm."
        required: false
        type: boolean
        default: true
      confirm:
        description: "Must be exactly 'yes' to allow a live (non-dry-run) dispatch publish."
        required: false
        default: "no"
  release:
    types: [published]

permissions:
  contents: read

jobs:
  gate:
    name: Publish gate (cohort CI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publication hygiene (leak-scan — this tree is public)
        run: bash scripts/leak-scan.sh
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - name: "Declared node: types (guuey#1406 — the mirror installs oss/ standalone)"
        run: pnpm check:node-types
      - name: "Publish ORDER covers packages/ (guuey#1383 — a package CI builds and npm never receives)"
        run: pnpm check:publish-order
      - name: "The bare-name forwarder moves with the cut (guuey#1864 — guuey 1.<minor>.<patch> runs @guuey/cli 0.<minor>.<patch>)"
        run: pnpm check:forwarder-pairing
      - name: "Pack reachability (guuey#1435 — every shipped file is reachable from an entry point, or declared)"
        run: pnpm check:pack-reachability
      - name: "The guard scripts' own tests"
        run: pnpm test:scripts

      - name: Plain-Node ESM import smoke (guuey#153 — every exports arm under bare node)
        run: pnpm check:esm
      - name: Scaffold smoke (template x framework matrix scaffolds + builds clean)
        run: pnpm smoke

  publish:
    name: Publish to npm (OIDC trusted publishing)
    needs: gate
    runs-on: ubuntu-latest
    # The GitHub environment named in the npmjs trusted-publisher config.
    environment: npm-publish
    permissions:
      contents: read
      # Required for npm Trusted Publishing + `--provenance`.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          # Deliberately NO `registry-url:` — setting it writes an
          # `_authToken=${NODE_AUTH_TOKEN}` line to .npmrc, and with the
          # token unset (we use OIDC) pnpm passes the literal placeholder
          # through and the registry 404s BEFORE OIDC fallback fires
          # (see ggui oss/release.yml for the full war story).

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Resolve run mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.dry-run }}" = "false" ] && [ "${{ inputs.confirm }}" = "yes" ]; then
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish (leaf-first, idempotent)
        # `id`: the post-publish smoke keys on THIS step's outcome (guuey#1538).
        id: publish
        env:
          DRY_RUN: ${{ steps.mode.outputs.dry_run }}
        run: |
          set -euo pipefail
          # Fixed leaf-first order: config/state/fs/agent-layout/widget-auth/
          # worker are leaves (agent-layout: react peer only, guuey#403);
          # host needs config+worker, threads needs mcp-apps-host,
          # chat needs agent-client+mcp-apps-host,
          # create-agentic-app needs config, cli needs all.
          ORDER=(hooks config state fs agent-layout mcp-apps-host threads widget-auth worker agent-client chat host create-agentic-app cli)

          TODO=()
          for pkg in "${ORDER[@]}"; do
            name=$(node -pe "require('./packages/$pkg/package.json').name")
            ver=$(node -pe "require('./packages/$pkg/package.json').version")
            if [ -n "$(npm view "$name@$ver" version 2>/dev/null)" ]; then
              echo "• $name@$ver already on npm — skipping"
              continue
            fi
            TODO+=("$pkg")
          done

          if [ "${#TODO[@]}" -eq 0 ]; then
            echo "Nothing to publish — every target version is already on npm."
            exit 0
          fi

          # Dry-run GATE first: pack + validate every target before any
          # irreversible publish. (--provenance is omitted here — dry runs
          # cannot mint provenance.)
          for pkg in "${TODO[@]}"; do
            (cd "packages/$pkg" && pnpm publish --dry-run --no-git-checks)
          done

          if [ "$DRY_RUN" = "true" ]; then
            echo "DRY RUN — stopping before live publish. Targets validated:"
            printf '  %s\n' "${TODO[@]}"
            exit 0
          fi

          for pkg in "${TODO[@]}"; do
            name=$(node -pe "require('./packages/$pkg/package.json').name")
            ver=$(node -pe "require('./packages/$pkg/package.json').version")
            echo "Publishing $name@$ver ..."
            (cd "packages/$pkg" && pnpm publish --provenance --no-git-checks)
          done

      - name: Verify cohort on npm (guuey#439 — a partial cohort turns this run RED)
        if: steps.mode.outputs.dry_run == 'false'
        run: |
          set -euo pipefail
          # The lane's npm-verify law, moved INSIDE the workflow: every ORDER
          # member must be readable at the cohort version before this run may
          # go green. Poll per package (registry read-lag after a successful
          # publish is real — the 0.15.1 worker stale-read); a member still
          # missing after the window means the cohort is genuinely partial
          # and the run FAILS LOUDLY — a green run can never again coexist
          # with a half-published cohort. (The dist-tag verify-before-tag
          # half of #439 — publishing on `next` and advancing `latest`
          # leaf-first — stays open on the issue: it needs npm's OIDC
          # trusted publishing to cover `dist-tag add`, unverified.)
          ORDER=(hooks config state fs agent-layout mcp-apps-host threads widget-auth worker agent-client chat host create-agentic-app cli)
          for pkg in "${ORDER[@]}"; do
            name=$(node -pe "require('./packages/$pkg/package.json').name")
            ver=$(node -pe "require('./packages/$pkg/package.json').version")
            ok=""
            # The STRONG read: `versions --json` updates ahead of the
            # packument summary a bare `npm view <pkg>@<ver> version` reads —
            # the abbreviated-metadata replica lags minutes behind a
            # successful publish (worker@0.16.5 false-partial, run
            # 32981119374: red run, complete cohort). Poll the full
            # versions array, wider window; a package missing THERE after
            # 10 minutes is genuinely unpublished (guuey#968: fs@0.18.5 took
            # ~5.5 min on BOTH reads — the 4-minute window turned a complete
            # cohort red and skipped the consumer smoke).
            # Fallback inside the poll: the TARBALL itself. worker's
            # packument replicas lag past even the versions-array window
            # (second false partial, run of 2026-08-27) — but the tarball
            # URL is what installs fetch, and it serves 200 the moment the
            # publish lands. Either read confirms; a package missing from
            # BOTH after the window is genuinely unpublished.
            base="${name#*/}"
            tarball="https://registry.npmjs.org/$name/-/$base-$ver.tgz"
            t0=$(date +%s)
            for _ in $(seq 1 60); do
              if npm view "$name" versions --json 2>/dev/null | grep -q "\"$ver\""; then ok=versions; break; fi
              if [ "$(curl -s -o /dev/null -w '%{http_code}' -I "$tarball")" = "200" ]; then ok=tarball; break; fi
              sleep 10
            done
            # The receipt line: WHICH read confirmed and how long after the
            # step started — the lag itself is the fact the next widening
            # (or narrowing) is argued from.
            [ -n "$ok" ] && echo "  ↳ $name@$ver seen via $ok after $(( $(date +%s) - t0 ))s"

            if [ -z "$ok" ]; then
              echo "::error ::$name@$ver is NOT on npm after publish — the cohort is partial"
              exit 1
            fi
            echo "• $name@$ver verified"
          done
          echo "cohort verified: ${#ORDER[@]}/${#ORDER[@]} on npm"

      - name: Announce-line cold resolve (guuey#439 — the stranger's install, proven in-run)
        if: steps.mode.outputs.dry_run == 'false'
        run: |
          set -euo pipefail
          GATE_TAG="latest"
          # The p1 half of #439 the zero-secret posture allows: the run may
          # not go green until the EXACT command the announce advertises —
          # a version-less install resolving `latest` — works cold. Two
          # gates, both token-free:
          #   1. `latest` COHERENCE: every ORDER member's dist-tags.latest
          #      reads the cohort version (publish advances latest per
          #      package immediately; a member stuck on the prior version
          #      after the window = the mixed-cohort state #439 exists for).
          #   2. COLD INSTALL: a fresh dir installs @guuey/cli@latest —
          #      the full dependency closure resolved from the registry,
          #      the ETARGET class surfaced HERE instead of on a stranger.
          # The structural fix (publish on `next`, advance latest leaf-first
          # after verify) stays HELD on the founder's zero-secret ruling:
          # OIDC covers publish only (npm/cli#8547 open; `npm stage
          # approve` is human-2FA proof-of-presence, not CI-automatable —
          # both re-verified 2026-08-31).
          VER=$(node -pe "require('./packages/config/package.json').version")
          ORDER=(hooks config state fs agent-layout mcp-apps-host threads widget-auth worker agent-client chat host create-agentic-app cli)
          for pkg in "${ORDER[@]}"; do
            name=$(node -pe "require('./packages/$pkg/package.json').name")
            ok=""
            for i in $(seq 1 24); do
              tag=$(npm view "$name" "dist-tags.$GATE_TAG" 2>/dev/null || true)
              if [ "$tag" = "$VER" ]; then ok=1; break; fi
              sleep 10
            done
            if [ -z "$ok" ]; then
              echo "::error ::$name dist-tags.$GATE_TAG reads '$tag', not $VER — $GATE_TAG is a MIXED cohort"
              exit 1
            fi
            echo "• $name $GATE_TAG -> $VER"
          done
          # The stranger's line, cold. --prefer-online defeats any runner
          # cache; retries absorb registry-edge lag inside the run instead
          # of exporting it to announce-week installs.
          COLD=$(mktemp -d)
          cd "$COLD" && npm init -y > /dev/null
          ok=""
          for i in $(seq 1 12); do
            if npm install "@guuey/cli@$GATE_TAG" --no-audit --no-fund --prefer-online > install.log 2>&1; then ok=1; break; fi
            echo "cold install attempt $i failed (likely propagation) — retrying in 20s"
            tail -3 install.log
            sleep 20
          done
          if [ -z "$ok" ]; then
            echo "::error ::cold 'npm install @guuey/cli@$GATE_TAG' NEVER resolved — the install line is broken"
            exit 1
          fi
          GOT=$(node -pe "require('./node_modules/@guuey/cli/package.json').version")
          if [ "$GOT" != "$VER" ]; then
            echo "::error ::cold install resolved @guuey/cli@$GOT, expected $VER — $GATE_TAG is stale or mixed"
            exit 1
          fi
          echo "announce line proven: cold @guuey/cli@$GATE_TAG == $VER, full closure installed"

      - name: Publish the bare-name forwarder if its version is new, and assert it is this cut's (guuey#449, guuey#1864)
        if: steps.mode.outputs.dry_run == 'false'
        run: |
          set -euo pipefail
          # packages/guuey is NOT a lockstep member (guueyLockstep:false):
          # it publishes here when its committed version is absent from npm.
          # Its version is 1.<cli minor>.<cli patch> (the gate job's
          # check:forwarder-pairing), so every cut moves it. This step runs
          # AFTER the cohort verify and the announce-line cold resolve: its
          # dependency is the exact cli version, so it goes live only once
          # that version resolves, and never while the cohort is unverified.
          # This workflow is the package's ONLY publish path BY DESIGN:
          # pnpm publish rewrites its `workspace:*` dependency to the exact
          # @guuey/cli version at pack time. The 1.0.0 incident was a manual
          # `npm publish`, which does NOT rewrite the protocol and shipped a
          # tarball broken for every consumer.
          ver=$(node -pe "require('./packages/guuey/package.json').version")
          cli=$(node -pe "require('./packages/cli/package.json').version")
          if [ -n "$(npm view "guuey@$ver" version 2>/dev/null)" ]; then
            echo "• guuey@$ver already on npm — skipping the publish"
          else
            (cd packages/guuey && pnpm publish --provenance --no-git-checks)
          fi
          # guuey#1864 — the forwarder on npm must be THIS cut's, read the
          # way an install reads it. The published tarball's own manifest
          # depends on exactly this cut's @guuey/cli, and `latest` is this
          # version, so a version-less `npx guuey` runs this cut's CLI.
          # Polled on the cohort verify's window (60 x 10 s): the registry
          # lags a publish, and the tarball is what serves first.
          tarball="https://registry.npmjs.org/guuey/-/guuey-$ver.tgz"
          dep=""; lat=""; t0=$(date +%s)
          for _ in $(seq 1 60); do
            dep=$(curl -sfL "$tarball" 2>/dev/null | tar -xzOf - package/package.json 2>/dev/null \
              | node -e 'const m = JSON.parse(require("fs").readFileSync(0, "utf8")); process.stdout.write(String(m.dependencies?.["@guuey/cli"] ?? ""))' 2>/dev/null || true)
            case "$dep" in workspace:*) break ;; esac   # a failed rewrite never heals: judge it now
            lat=$(npm view guuey dist-tags.latest 2>/dev/null || true)
            [ "$dep" = "$cli" ] && [ "$lat" = "$ver" ] && break
            sleep 10
          done
          case "$dep" in
            workspace:*)
              echo "::error ::guuey@$ver was published with dependency '$dep' — the workspace rewrite FAILED"
              exit 1
              ;;
          esac
          if [ "$dep" != "$cli" ] || [ "$lat" != "$ver" ]; then
            echo "::error ::the forwarder on npm is not this cut's after $(( $(date +%s) - t0 ))s: guuey@$ver runs @guuey/cli '$dep' (want $cli), guuey latest is '$lat' (want $ver)"
            exit 1
          fi
          echo "• guuey@$ver verified after $(( $(date +%s) - t0 ))s: it is latest, and its published manifest runs @guuey/cli@$dep"

      - name: Post-publish consumer smoke
        # `always()`: a red verify (a lagging registry replica, guuey#968) must
        # not SKIP the one step that proves installability; `continue-on-error`
        # below still keeps this step from ever failing the release.
        # `steps.publish.outcome == 'success'`: but a FAILED publish step has
        # nothing to smoke, and this step's warning used to assert "Publish
        # SUCCEEDED" from its own assumption after exactly that (v0.26.0's first
        # run, 2026-09-19: zero members on npm, the sentence printed anyway —
        # guuey#1538). The publish step's outcome is the only thing this step
        # may speak for; the registry read is the verify step's.
        if: always() && steps.mode.outputs.dry_run == 'false' && steps.publish.outcome == 'success'
        # NEVER fails the release: publish already happened (irreversible), so a
        # red job here would falsely brand a successful release as broken. npm
        # CDN propagation for `npx @latest` can lag minutes behind a successful
        # publish — this step is a best-effort post-check that WARNS on a miss,
        # not a gate. `continue-on-error` keeps the run green; the annotation
        # below surfaces a genuine (non-propagation) problem to a human.
        continue-on-error: true
        run: |
          set -uo pipefail
          # Pin the just-published version, not @latest — the version resolves on
          # the registry before the `latest` dist-tag fully propagates to every
          # CDN edge, so this races less.
          VER=$(node -pe "require('./packages/create-agentic-app/package.json').version")
          echo "smoke target: @guuey/create-agentic-app@${VER}"
          mkdir -p /tmp/consumer-smoke && cd /tmp/consumer-smoke

          # Wait (up to ~6 min) for the exact version to be resolvable, THEN npx.
          for attempt in $(seq 1 18); do
            if npm view "@guuey/create-agentic-app@${VER}" version >/dev/null 2>&1; then
              echo "version live on registry (attempt ${attempt})"
              break
            fi
            echo "not propagated yet — retry ${attempt}/18 in 20s"
            sleep 20
          done

          if npx --yes "@guuey/create-agentic-app@${VER}" ./smoke-app --framework claude-agent-sdk --skip-install \
            && test -f ./smoke-app/guuey.json \
            && npx --yes "@guuey/cli@${VER}" --version; then
            echo "consumer smoke OK — scaffold + CLI resolve from the public registry"
          else
            echo "::warning title=Consumer smoke did not complete::The publish step exited 0 (this step runs only then); the post-publish npx check did not resolve @${VER} in time — almost always CDN propagation lag. Whether every member is on npm is the Verify step's line above, not this one's. Check by hand: npx @guuey/create-agentic-app@${VER}"
          fi
