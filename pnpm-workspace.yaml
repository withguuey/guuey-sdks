packages:
  - "packages/*"

# pnpm 11 blocks dependency install scripts by default and hard-errors the
# install while unapproved ones exist. The key it actually reads is
# `allowBuilds` (per-package boolean; `onlyBuiltDependencies` is silently
# ignored in both package.json and this file — verified empirically in the
# silverprotocol SDK, same pnpm). Every flagged package is listed with
# `false`: none need their scripts here (esbuild ships prebuilt platform
# binaries as optionalDependencies; the rest are native/CLI extras unused
# by the build, tests, and scaffold smoke — all verified green on a cold
# clone with every entry false).
# @google/adk (host devDep/peer) declares five NON-optional @mikro-orm/*
# driver peers; auto-installing them drags in sqlite3's native build. None
# are needed (InMemoryRunner only) — same posture as the scaffolded
# templates and the guuey monorepo root.
autoInstallPeers: false

# pnpm resolves the NEAREST workspace file, so any script executed inside
# oss/packages/* binds to THIS workspace — not the monorepo root, whose
# pnpm-workspace.yaml already sets `verifyDepsBeforeRun: false`. Without
# the same setting here, pnpm 11's pre-run deps check fires when the
# monorepo's turbo graph runs an oss package's build (Amplify does
# filtered installs, so the check always reads "outdated") and auto-runs
# `pnpm install` — two oss builds in parallel then race each other
# (EISDIR renames; broke platform Amplify job 108 on 2026-07-16). The
# oss standalone CI does explicit installs, so nothing relies on the
# auto-install.
verifyDepsBeforeRun: false

allowBuilds:
  "@anthropic-ai/claude-agent-sdk": false
  sqlite3: false
  "@google/genai": false
  esbuild: false
  onnxruntime-node: false
  protobufjs: false
  sharp: false
  # guuey#1581: @google/adk 2.1.0 depends on dockerode → docker-modem → ssh2,
  # whose optional cpu-features is a node-gyp build. Nothing in this workspace
  # opens a Docker socket or an SSH session (InMemoryRunner only; the host
  # devDep is a type/peer surface), so neither script runs here. pnpm 11 wrote
  # the placeholders during the 2.1.0 re-resolve; a placeholder fails every
  # frozen install (ERR_PNPM_IGNORED_BUILDS) until it is decided.
  cpu-features: false
  ssh2: false

# pnpm 11's supply-chain age gate (minimumReleaseAge, default 1440 min in
# fresh CI) blocks deps published <24h ago. @silverprotocol/* and @ggui-ai/*
# are FIRST-PARTY (we publish both, often consumed same-day — the
# silverprotocol 0.3.2 bump tripped this in the v0.1.2 release gate;
# @ggui-ai/protocol 0.6.3 tripped it again in v0.2.3), so exclude those
# packages UNVERSIONED: exact name@version pins would need editing on every
# same-day release. Third-party deps keep the full age gate.
minimumReleaseAgeExclude:
  - "@silverprotocol/core"
  - "@silverprotocol/claude-agent-sdk"
  - "@silverprotocol/openai-agents"
  - "@silverprotocol/google-adk"
  - "@silverprotocol/richtext"
  - "@ggui-ai/protocol"
  - "@ggui-ai/artifact-manifest"
  # Our OWN cohort (guuey#453): @guuey/* is FIRST-PARTY and consumed
  # same-day by design (daily cut cadence) — a cli-only exception proved
  # too narrow the day after it landed (fleet installs browned out on the
  # age gate rejecting our own 0.16.4). The whole family rides the
  # exclude UNVERSIONED, plus the bare-name forwarder (guuey#449), which
  # deps @guuey/cli by caret and is itself same-day-consumed once
  # published. Third-party deps keep the full gate.
  - "@guuey/agent-client"
  - "@guuey/agent-layout"
  - "@guuey/chat"
  - "@guuey/cli"
  - "@guuey/config"
  - "@guuey/create-agentic-app"
  - "@guuey/fs"
  - "@guuey/hooks"
  - "@guuey/host"
  - "@guuey/mcp-apps-host"
  - "@guuey/state"
  - "@guuey/threads"
  - "@guuey/widget-auth"
  - "@guuey/worker"
  - "guuey"
  # Versioned age-gate exclusions for the CURRENT image sdk pin (0.3.282 was
  # ~24h old at bump time — outside the 24h gate, kept so a re-install inside
  # 24h of a future bump still resolves). These rot at every sdk bump: swap
  # them WITH the pin (guuey#659 rails; windows guuey#949, guuey#1306, guuey#1580, guuey#1607, guuey#1807), never append.
  - "@anthropic-ai/claude-agent-sdk-darwin-arm64@0.3.282"
  - "@anthropic-ai/claude-agent-sdk-darwin-x64@0.3.282"
  - "@anthropic-ai/claude-agent-sdk-linux-arm64-musl@0.3.282"
  - "@anthropic-ai/claude-agent-sdk-linux-arm64@0.3.282"
  - "@anthropic-ai/claude-agent-sdk-linux-x64-musl@0.3.282"
  - "@anthropic-ai/claude-agent-sdk-linux-x64@0.3.282"
  - "@anthropic-ai/claude-agent-sdk-win32-arm64@0.3.282"
  - "@anthropic-ai/claude-agent-sdk-win32-x64@0.3.282"
  - "@anthropic-ai/claude-agent-sdk@0.3.282"

# guuey#227: brace-expansion patched-line pins — see the root
# pnpm-workspace.yaml `overrides:` comment (same family, this workspace has
# its own lockfile so it needs its own block).
overrides:
  # guuey#1541: ONE zod per major. Every `^4.x` importer resolves the same 4.x — the cohort's 4.4.3 (the version the
  # platform/portal/chat/cli/config importers and CI's widget byte budget were green on; every SDK peer range admits it:
  # claude-agent-sdk / openai-agents ^4.0.0, mcp sdk ^3.25||^4.0). Two 4.x copies in one tree broke @guuey/config's
  # declaration emit (TS2742). NOT the newest 4.x on purpose: zod 4.6.5 adds +126,462 B to the widget's inline bundle
  # (zod 330,048 -> 456,510 B minified; budget 786,432, measured 771,120 at 958e3653d; guuey#1542) — a newer 4.x is a
  # deliberate bump gated by that budget. pnpm deploy reads this override, so the agent image's zod follows it (the image
  # had drifted to npm-latest 4.6.5 through deploy's caret re-resolution). check-lockfile-parity's SINGLETONS rule
  # refuses a second 4.x. The mcp-servers' exact 3.25.76 (guuey#125) is a separate major, untouched.
  "zod@^4": 4.4.3
  # GHSA-7q85-xj36-vmfc (Dependabot alerts 283/284, 2026-09-18, HIGH): adm-zip < 0.6.1 allocates the DECLARED uncompressed
  # size before reading (DoS). Pulled only by @google/adk (^0.5.17, which excludes the fix); 0.5.18 → 0.6.1 removes no
  # method adk calls (getEntries, readFile, the Buffer constructor). Lifts when adk's own range admits 0.6.1.
  adm-zip: ">=0.6.1"
  "brace-expansion@1": ^1.1.18
  "brace-expansion@2": ^2.1.4
  "brace-expansion@5": ^5.0.9
  # guuey#219 P2 — see the root pnpm-workspace.yaml comment (own lockfile).
  "body-parser@1": ^1.20.6
  "uuid@11": ^11.1.1
  # guuey#289 (#219's leftover major): GHSA-w5hq-g745-h8pq patches only
  # 11.1.1 — uuid@9 rides the googleapis chain under @guuey/host's
  # @google/adk DEVdep (v4()-only callers; never in a published artifact's
  # runtime dependency tree). See the root pnpm-workspace.yaml comment.
  "uuid@<11": ^11.1.1
  "@hono/node-server": ^1.19.15
  "@opentelemetry/core@2": ^2.8.0
  # guuey#692 — see the root pnpm-workspace.yaml comment (own lockfile, same
  # two chains here: fast-uri 3.1.5 under ajv@8 / fast-json-stringify, qs
  # 6.15.3 under the express/body-parser chain of @guuey/cli + mcp-apps-host).
  "fast-uri@3": ^3.1.6
  "qs@6": ^6.16.0
  # guuey#687-rails — see the root pnpm-workspace.yaml comment: ONE MCP SDK
  # per lockfile; the peer-resolved transitive dependents (claude-agent-sdk,
  # ext-apps, the @ggui-ai/* trio) follow the tested line. Moves with each
  # sdk bump, never a major.
  # guuey#1807 (W40 row 2): 1.30.0 → 1.30.1 (mirror of the root override).
  "@modelcontextprotocol/sdk@1": ^1.30.1
  # guuey#1188 — 2026-09-08 advisory batch: major-scoped pins for transitives (js-yaml merge-key CPU DoS GHSA-2883-xcg3-v3hh; hono GHSA-gqvv-2mrq-wpjv/g6gw-c38x-mqfc/crvj-82cr-hjcx; svgo removeScripts bypass GHSA-w27v-7q3p-w38r). Same shape as the @modelcontextprotocol/sdk@1 pin: never dedupe, never a blanket override.
  "js-yaml@3": 3.15.2
  "js-yaml@4": 4.3.2
  "hono@4": ^4.13.5
